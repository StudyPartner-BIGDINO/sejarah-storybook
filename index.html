<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>联邦宪法的历史背景 · 10页全屏有声故事绘本</title>
  <style>
    :root {
      --hl-yellow: #fff04b;
      --pink-main: #ec2f87;
      --purple-main: #6a1b9a;
      --blue-srw: #1565c0;
      --green-sbh: #2e7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #160f24;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }

    .book-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 2600px;
      overflow: hidden;
    }

    .book-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    /* Full-Screen Story Spreads (Desktop & Landscape Default) */
    .spreads-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .spread {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transform-origin: left center;
      transition: transform 0.68s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.42s ease;
    }

    .spread.active {
      opacity: 1;
      pointer-events: auto;
      transform: rotateY(0deg);
      z-index: 3;
    }

    .spread.flipped-left {
      opacity: 0;
      transform: rotateY(-80deg);
      z-index: 2;
    }

    .spread.upcoming-right {
      opacity: 0;
      transform: rotateY(14deg) scale(0.985);
      z-index: 1;
    }

    .spread-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      z-index: 1;
      transition: transform 9s ease-out;
    }

    .spread.active .spread-bg {
      transform: scale(1.02);
    }

    /* Subtle bottom-only gradient so 88%+ of the full-screen artwork is 100% unobstructed */
    .bottom-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(12, 8, 20, 0.22) 0%,
        rgba(12, 8, 20, 0) 11%,
        rgba(12, 8, 20, 0) 74%,
        rgba(16, 11, 26, 0.68) 100%
      );
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* Top Minimal Chapter & Page Indicator Bar */
    .top-bar {
      position: absolute;
      top: max(1.8%, env(safe-area-inset-top));
      left: max(2%, env(safe-area-inset-left));
      right: max(2%, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      gap: 10px;
    }

    .chapter-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(20, 14, 32, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      pointer-events: auto;
      overflow-x: auto;
      scrollbar-width: none;
      max-width: 100%;
    }

    .chapter-nav::-webkit-scrollbar {
      display: none;
    }

    .ch-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(11px, 0.95vw, 13.5px);
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .ch-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .ch-btn.current {
      background: linear-gradient(135deg, #ff3d9a, #ff8a00);
      color: #fff;
      box-shadow: 0 3px 10px rgba(255, 61, 154, 0.45);
    }

    .top-right-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      flex-shrink: 0;
    }

    .page-pill {
      background: rgba(20, 14, 32, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffe082;
      font-weight: 800;
      font-size: clamp(11.5px, 0.98vw, 13.5px);
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 224, 130, 0.35);
      white-space: nowrap;
    }

    .tool-btn {
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(20, 14, 32, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: clamp(11px, 0.95vw, 13px);
      font-weight: 700;
      padding: 5px 13px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* Cover Floating Title Banner */
    .cover-floating-header {
      position: absolute;
      top: 8.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      text-align: center;
      background: linear-gradient(135deg, rgba(106, 27, 154, 0.9), rgba(173, 20, 87, 0.9));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2.5px solid #ffd54f;
      border-radius: 999px;
      padding: 8px 28px 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
      max-width: 92%;
      transition: opacity 0.3s ease;
    }

    .cover-floating-bm {
      font-size: clamp(14px, 1.85vw, 27px);
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      line-height: 1.2;
    }

    .cover-floating-zh {
      display: inline-block;
      margin-top: 3px;
      background: #ff2e88;
      color: #fff;
      font-size: clamp(11.5px, 1.2vw, 17px);
      font-weight: 800;
      padding: 2px 14px;
      border-radius: 999px;
    }

    /* Left & Right Page Turn Click Zones */
    .edge-nav {
      position: absolute;
      top: 14%;
      bottom: 18%;
      width: 5%;
      min-width: 40px;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s ease;
    }

    .edge-nav:hover {
      opacity: 1;
    }

    .edge-prev { left: max(0.7%, env(safe-area-inset-left)); }
    .edge-next { right: max(0.7%, env(safe-area-inset-right)); }

    .edge-circle {
      width: clamp(34px, 3vw, 46px);
      height: clamp(34px, 3vw, 46px);
      border-radius: 50%;
      background: rgba(20, 14, 32, 0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(14px, 1.4vw, 20px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38);
    }

    .edge-nav.disabled {
      opacity: 0.12;
      pointer-events: none;
    }

    .mobile-swipe-hint {
      display: none;
    }

    /* Unified Slim Picture-Book Story Ribbon & Audio Dock */
    .storybook-ribbon {
      position: absolute;
      bottom: max(1.6%, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      width: min(95%, 1260px);
      background: rgba(255, 252, 246, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: clamp(8px, 1.2vh, 13px) clamp(14px, 1.6vw, 22px);
      box-shadow: 0 14px 38px rgba(10, 6, 20, 0.48);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(12px, 1.4vw, 20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .art-only .storybook-ribbon .story-text-col,
    .art-only .cover-floating-header,
    .art-only .bottom-vignette {
      opacity: 0;
      pointer-events: none;
    }

    .art-only .storybook-ribbon {
      width: auto;
      background: rgba(22, 16, 34, 0.84);
      border-color: rgba(255, 255, 255, 0.25);
      padding: 7px 14px;
    }

    .art-only .storybook-ribbon .story-text-col {
      display: none;
    }

    .art-only .time-label,
    .art-only .ctrl-chip {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.12);
    }

    .story-text-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .story-top-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(11px, 0.95vw, 13.5px);
      font-weight: 900;
      color: #fff;
      padding: 2px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tag-cover { background: linear-gradient(135deg, #7b1fa2, #ec2f87); }
    .tag-nns   { background: linear-gradient(135deg, #c2185b, #ec407a); }
    .tag-srw   { background: linear-gradient(135deg, #0d47a1, #1e88e5); }
    .tag-sbh   { background: linear-gradient(135deg, #1b5e20, #43a047); }
    .tag-mem   { background: linear-gradient(135deg, #e65100, #ff2e88); }

    .story-main-line {
      font-size: clamp(13.5px, 1.18vw, 17.5px);
      font-weight: 800;
      color: #1f172b;
      line-height: 1.45;
    }

    .story-sub-line {
      font-size: clamp(12px, 1.02vw, 14.5px);
      font-weight: 600;
      color: #4f4560;
      line-height: 1.38;
    }

    .hl {
      background: var(--hl-yellow);
      color: #111;
      padding: 1px 6px;
      border-radius: 5px;
      font-weight: 900;
      box-shadow: 0 1px 0 rgba(0,0,0,0.08);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .istilah-inline {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .istilah-pill {
      background: #fce4ec;
      border: 1.5px solid #f06292;
      color: #ad1457;
      font-weight: 900;
      padding: 1px 9px;
      border-radius: 999px;
      font-size: clamp(12px, 1.02vw, 14.5px);
    }

    /* Compact 6-Pill Strip on Page 10 (Mnemonic Finale) */
    .mnemonic-mini-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      margin-top: 3px;
    }

    .mm-box {
      border-radius: 10px;
      padding: 3px 6px;
      text-align: center;
      font-size: clamp(10.5px, 0.88vw, 13px);
      font-weight: 800;
      line-height: 1.22;
      color: #1e162b;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .mm-box b {
      color: #c62828;
      font-size: clamp(11.5px, 0.98vw, 14.5px);
    }

    .mm-1 { background: #ede7f6; }
    .mm-2 { background: #fff8e1; }
    .mm-3 { background: #e1f5fe; }
    .mm-4 { background: #fce4ec; }
    .mm-5 { background: #e8f5e9; }
    .mm-6 { background: #f3e5f5; }

    /* Audio Controls inside Ribbon */
    .audio-controls-col {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .play-btn {
      border: none;
      background: linear-gradient(135deg, #ff2e88, #ff7b54);
      color: #fff;
      font-weight: 800;
      font-size: clamp(12.5px, 1.05vw, 15px);
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      box-shadow: 0 5px 15px rgba(255, 46, 136, 0.4);
      transition: transform 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.97);
    }

    .play-btn.playing {
      background: linear-gradient(135deg, #00c853, #009688);
      box-shadow: 0 5px 15px rgba(0, 200, 83, 0.38);
    }

    .eq-bars {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 13px;
    }

    .play-btn.playing .eq-bars {
      display: inline-flex;
    }

    .eq-bars span {
      width: 2.8px;
      background: #fff;
      border-radius: 2px;
      animation: eqBounce 0.65s infinite ease-in-out alternate;
    }

    .eq-bars span:nth-child(1) { height: 5px; animation-delay: 0s; }
    .eq-bars span:nth-child(2) { height: 12px; animation-delay: 0.18s; }
    .eq-bars span:nth-child(3) { height: 7px; animation-delay: 0.34s; }

    @keyframes eqBounce {
      from { height: 4px; }
      to { height: 13px; }
    }

    .mini-progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: clamp(78px, 7.5vw, 115px);
    }

    .progress-bar {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: rgba(30, 20, 48, 0.15);
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff2e88, #ff9100);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .time-label {
      font-size: 11px;
      font-weight: 700;
      color: #5c526e;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .ctrl-chip {
      border: 1.5px solid rgba(30, 20, 48, 0.16);
      background: rgba(255, 255, 255, 0.8);
      color: #2b213a;
      font-size: 11.5px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .ctrl-chip.on {
      background: #fff3cd;
      border-color: #ffb300;
      color: #b26a00;
    }

    /* =====================================================================
       MOBILE PORTRAIT MODE (竖屏手机适配：上画下书，100% 不裁切左右画面人物！)
       ===================================================================== */
    @media (max-width: 860px) and (orientation: portrait) {
      .book-stage {
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at top, #2c1a42 0%, #140d20 100%);
        padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
        gap: 8px;
      }

      .top-bar {
        position: relative;
        top: auto;
        left: auto;
        right: auto;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        flex-shrink: 0;
      }

      .top-right-tools {
        justify-content: space-between;
      }

      #artToggleBtn {
        display: none;
      }

      /* Uncropped 16:9 Storybook Picture Frame */
      .spreads-container {
        position: relative;
        inset: auto;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
        border: 2px solid rgba(255, 224, 130, 0.35);
        flex-shrink: 0;
        background: #0f0a18;
      }

      .spread-bg {
        object-fit: cover;
        object-position: center center;
      }

      .bottom-vignette {
        display: none;
      }

      .cover-floating-header {
        top: 6%;
        padding: 4px 14px 5px;
        border-width: 1.5px;
      }

      .cover-floating-bm {
        font-size: 12px;
      }

      .cover-floating-zh {
        font-size: 10px;
        padding: 1px 10px;
      }

      .edge-nav {
        top: 0;
        bottom: 0;
        height: auto;
        display: none;
      }

      .mobile-swipe-hint {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgba(255, 255, 255, 0.78);
        font-size: 11.5px;
        font-weight: 700;
        padding: 0 4px;
        flex-shrink: 0;
      }

      .mobile-nav-btns {
        display: flex;
        gap: 8px;
      }

      .m-turn-btn {
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        padding: 4px 12px;
        border-radius: 999px;
        cursor: pointer;
      }

      .m-turn-btn:disabled {
        opacity: 0.3;
      }

      /* Story Card + Audio Bar cleanly stacked below the 16:9 artwork */
      .storybook-ribbon {
        position: relative;
        bottom: auto;
        left: auto;
        transform: none;
        width: 100%;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        align-items: stretch;
        justify-content: space-between;
        padding: 14px 15px;
        border-radius: 18px;
        gap: 10px;
      }

      .story-text-col {
        overflow-y: auto;
        gap: 7px;
        padding-right: 2px;
      }

      .tag-badge {
        font-size: 12px;
        padding: 3px 12px;
      }

      .story-main-line {
        font-size: 15.5px;
        line-height: 1.55;
      }

      .story-sub-line {
        font-size: 13.5px;
        line-height: 1.5;
      }

      .mnemonic-mini-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 4px;
      }

      .mm-box {
        font-size: 12px;
        padding: 5px 6px;
      }

      .mm-box b {
        font-size: 13px;
      }

      .audio-controls-col {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
        padding-top: 10px;
        border-top: 1.5px solid rgba(30, 20, 48, 0.1);
        gap: 8px;
      }

      .play-btn {
        padding: 10px 18px;
        font-size: 14px;
      }

      .mini-progress-wrap {
        flex: 1;
        min-width: 90px;
      }
    }

    /* =====================================================================
       MOBILE LANDSCAPE MODE (手机横屏全屏模式：紧凑窄栏，满屏看大图！)
       ===================================================================== */
    @media (max-height: 520px) and (orientation: landscape) {
      .top-bar {
        top: 2%;
      }

      .chapter-nav {
        padding: 3px 8px;
        gap: 4px;
      }

      .ch-btn {
        font-size: 10.5px;
        padding: 3px 8px;
      }

      .page-pill, .tool-btn {
        font-size: 10.5px;
        padding: 3px 9px;
      }

      .cover-floating-header {
        top: 11%;
        padding: 4px 16px 5px;
      }

      .cover-floating-bm { font-size: 13px; }
      .cover-floating-zh { font-size: 10.5px; }

      .storybook-ribbon {
        bottom: 1.5%;
        padding: 5px 12px;
        border-radius: 15px;
        gap: 10px;
      }

      .tag-badge {
        font-size: 10px;
        padding: 1px 8px;
      }

      .story-main-line {
        font-size: 12px;
        line-height: 1.3;
      }

      .story-sub-line {
        font-size: 10.8px;
        line-height: 1.25;
      }

      .mnemonic-mini-row {
        gap: 4px;
      }

      .mm-box {
        font-size: 9.5px;
        padding: 2px 4px;
      }

      .play-btn {
        padding: 6px 12px;
        font-size: 11.5px;
      }

      .ctrl-chip {
        padding: 3px 8px;
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>

<div class="book-viewport">
  <div class="book-stage" id="bookStage">

    <!-- Top Minimal Chapter Bar -->
    <div class="top-bar">
      <div class="chapter-nav">
        <button class="ch-btn current" data-group="cover" onclick="goToPage(0)">📖 封面</button>
        <button class="ch-btn" data-group="nns" onclick="goToPage(1)">① NNS (3页)</button>
        <button class="ch-btn" data-group="srw" onclick="goToPage(4)">② Sarawak (3页)</button>
        <button class="ch-btn" data-group="sbh" onclick="goToPage(7)">③ Sabah (2页)</button>
        <button class="ch-btn" data-group="mem" onclick="goToPage(9)">🌟 记忆法</button>
      </div>

      <div class="top-right-tools">
        <span class="page-pill" id="pageIndicator">第 1 / 10 页</span>
        <button class="tool-btn" id="artToggleBtn" onclick="toggleArtOnly()">🖼 纯享全图</button>
        <button class="tool-btn" onclick="toggleFullScreen()">⛶ 全屏</button>
      </div>
    </div>

    <!-- 10 Full-Screen Rich Picture-Book Spreads -->
    <div class="spreads-container" id="spreadsContainer">
      <section class="spread active" data-page="0">
        <img class="spread-bg" src="images/p01.jpg" alt="联邦宪法的历史背景封面" />
        <div class="bottom-vignette"></div>
        <div class="cover-floating-header">
          <div class="cover-floating-bm">Latar Belakang Sejarah Perlembagaan Persekutuan</div>
          <div class="cover-floating-zh">联邦宪法的历史背景 · 有声故事绘本</div>
        </div>
      </section>

      <section class="spread upcoming-right" data-page="1">

    <!-- Mobile Portrait Swipe Hint & Quick Turn Buttons -->

    <!-- Slim Bottom Picture-Book Bilingual Story Strip + Teacher Audio Player -->
    <div class="storybook-ribbon" id="storybookRibbon">

      <div class="audio-controls-col">

            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time-label" id="timeLabel">00:00 / 00:00</span>
        </div>

        <button class="ctrl-chip on" id="autoNextBtn" onclick="toggleAutoNext()" title="讲完本页自动翻到下一页">
          🔁 自动翻页

        <select class="ctrl-chip" id="speedSelect" onchange="changeSpeed()" title="调节语速">
          <option value="0.9">0.9x</option>

<audio id="teacherAudio" preload="auto" playsinline></audio>

<script>
  const PAGES = [
    {
      group: "cover",
      tagClass: "tag-cover",
      tagText: "📚 绘本导读",
      mainHtml: `探索我国《联邦宪法》的三大历史来源：<span class="hl">① Negeri-negeri Selat (NNS)</span> · <span class="hl">② Sarawak</span> · <span class="hl">③ Sabah</span>`,
      subHtml: `早年在这三个地方建立的宪章、立法与行政治理机构，奠定了今天马来西亚宪政制度的重要根基。`,
      audio: "audio/p01.mp3"
    },
    {
      group: "nns",
      tagClass: "tag-nns",
      tagText: "① Negeri-negeri Selat (NNS) · 第 1 幕",
      mainHtml: `海峡殖民地（<span class="hl">槟城 Pulau Pinang · 马六甲 Melaka · 新加坡 Singapura</span>）港口贸易繁荣，各地人口大量聚集。`,
      subHtml: `随着商船往来与多元人口定居经商，当地社会迫切需要一套公正、明确的法律制度来维持秩序。`,
      audio: "audio/p02.mp3"
    },
    {
      group: "nns",
      tagClass: "tag-nns",
      tagText: "① Negeri-negeri Selat (NNS) · 第 2 幕",
      mainHtml: `在缺乏完善法律保护的早期，当地原住民（<span class="hl">penduduk asal</span>）容易遭受压迫（<span class="hl">penindasan</span>）与不公正对待（<span class="hl">ketidakadilan</span>）。`,
      subHtml: `如何用法律守护当地原住民的基本权益，成为海峡殖民地最重要的课题。`,
      audio: "audio/p03.mp3"
    },
    {
      group: "nns",
      tagClass: "tag-nns",
      tagText: "① Negeri-negeri Selat (NNS) · 核心考点",
      mainHtml: `• NNS memperkenalkan <span class="hl">Charter of Justice</span>. &nbsp; • Matlamatnya ialah <span class="hl">melindungi penduduk asal daripada penindasan dan ketidakadilan</span>.`,
      subHtml: `海峡殖民地正式引入《司法宪章》（Charter of Justice），核心目的就是保护原住民免受压迫和不公正的对待！`,
      audio: "audio/p04.mp3"
    },
    {
      group: "srw",
      tagClass: "tag-srw",
      tagText: "② Sarawak 砂拉越 · 第 1 幕",
      mainHtml: `• Perlembagaan Sarawak <span class="hl">memberikan kuasa kepada Council Negeri</span> (Majlis Negeri).`,
      subHtml: `砂拉越宪法（Perlembagaan Sarawak）很早就赋予了州议会（Council Negeri / Majlis Negeri）商议政事的权力。`,
      audio: "audio/p05.mp3"
    },
    {
      group: "srw",
      tagClass: "tag-srw",
      tagText: "② Sarawak 砂拉越 · 1959 改革",
      mainHtml: `• Pada <span class="hl">tahun 1959</span>, kuasa pentadbiran negeri diberikan kepada <span class="hl">Majlis Tertinggi dan Council Negeri</span>.`,
      subHtml: `到了关键的 1959 年，砂拉越的州行政权力正式交给了「最高理事会」与「州议会」两大核心机构！`,
      audio: "audio/p06.mp3"
    },
    {
      group: "srw",
      tagClass: "tag-srw",
      tagText: "② Sarawak 砂拉越 · Istilah Penting 重要术语",
      mainHtml: `两大机构职责分工：<span class="istilah-inline"><span class="istilah-pill">Majlis Tertinggi ＝ 管理（行政）</span><span class="istilah-pill">Council Negeri / Majlis Negeri ＝ 批准法律</span></span>`,
      subHtml: `牢记砂拉越改革年份是 1959 年：一个负责日常行政「管理」，一个负责审议与「批准法律」！`,
      audio: "audio/p07.mp3"
    },
    {
      group: "sbh",
      tagClass: "tag-sbh",
      tagText: "③ Sabah 沙巴 · 1960 新篇章",
      mainHtml: `紧随砂拉越（1959 年）之后，神山脚下的沙巴在 <span class="hl">tahun 1960</span> 正式设立两大机构来管理州属（mentadbir negeri）。`,
      subHtml: `年份顺口记：1959 砂拉越 → 1960 沙巴，前后刚好相差一年！`,
      audio: "audio/p08.mp3"
    },
    {
      group: "sbh",
      tagClass: "tag-sbh",
      tagText: "③ Sabah 沙巴 · 核心考点",
      mainHtml: `• Pada <span class="hl">tahun 1960</span>, ditubuhkan <span class="hl">Majlis Undangan</span> dan <span class="hl">Majlis Kerja</span> di Sabah untuk mentadbir negeri.`,
      subHtml: `1960 年沙巴成立的是「立法议会」（Majlis Undangan）与「执行理事会」（Majlis Kerja），名称与砂拉越不同哦！`,
      audio: "audio/p09.mp3"
    },
    {
      group: "mem",
      tagClass: "tag-mem",
      tagText: "🌟 老师万能记忆法",
      mainHtml: `口诀：<span class="hl" style="font-size:1.08em;">砂拉越最高的州巴 UK！</span>（一句话把砂拉越 & 沙巴四大机构全部锁死！）`,
      subHtml: `<div class="mnemonic-mini-row">
        <div class="mm-box mm-1"><b>砂拉越</b> = Sarawak</div>
        <div class="mm-box mm-2"><b>最高</b> = Majlis Tertinggi</div>
        <div class="mm-box mm-3"><b>的州</b> = Council / Majlis Negeri</div>
        <div class="mm-box mm-4"><b>巴</b> = Sabah</div>
        <div class="mm-box mm-5"><b>U</b> = Majlis Undangan</div>
        <div class="mm-box mm-6"><b>K</b> = Majlis Kerja</div>
      </div>`,
      audio: "audio/p10.mp3"
    }
  ];

  let currentPage = 0;
  let autoNext = true;
  const audioEl = document.getElementById("teacherAudio");
  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const playLabel = document.getElementById("playLabel");
  const progressFill = document.getElementById("progressFill");
  const timeLabel = document.getElementById("timeLabel");
  const storyTextCol = document.getElementById("storyTextCol");

  function playPageFlipSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = ctx.sampleRate * 0.12;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const env = Math.sin((i / bufferSize) * Math.PI);
        data[i] = (Math.random() * 2 - 1) * env * 0.038;
      }
      const noise = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1150;
      noise.buffer = buffer;
      noise.connect(filter);
      filter.connect(ctx.destination);
      noise.start();
    } catch (e) {}
  }

  function formatSec(s) {
    if (!isFinite(s) || s < 0) return "00:00";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  function renderPageUI() {
    const spreads = document.querySelectorAll(".spread");
    spreads.forEach((el, idx) => {
      el.classList.remove("active", "flipped-left", "upcoming-right");
      if (idx === currentPage) el.classList.add("active");
      else if (idx < currentPage) el.classList.add("flipped-left");
      else el.classList.add("upcoming-right");
    });

    const p = PAGES[currentPage];
    document.querySelectorAll(".ch-btn").forEach((btn) => {
      btn.classList.toggle("current", btn.dataset.group === p.group);
    });

    document.getElementById("pageIndicator").textContent = `第 ${currentPage + 1} / ${PAGES.length} 页`;
    document.getElementById("btnPrev").classList.toggle("disabled", currentPage === 0);
    document.getElementById("btnNext").classList.toggle("disabled", currentPage === PAGES.length - 1);

    const mPrev = document.getElementById("mBtnPrev");
    const mNext = document.getElementById("mBtnNext");
    if (mPrev) mPrev.disabled = currentPage === 0;
    if (mNext) mNext.disabled = currentPage === PAGES.length - 1;

    storyTextCol.innerHTML = `
      <div class="story-top-row">
        <span class="tag-badge ${p.tagClass}">${p.tagText}</span>
      </div>
      <div class="story-main-line">${p.mainHtml}</div>
      <div class="story-sub-line">${p.subHtml}</div>
    `;
  }

  function setPlayingUI(isPlaying) {
    playBtn.classList.toggle("playing", isPlaying);
    playIcon.textContent = isPlaying ? "⏸" : "▶";
    playLabel.textContent = isPlaying ? "暂停" : "听老师讲";
  }

  function stopCurrentAudio() {
    audioEl.pause();
    audioEl.currentTime = 0;
    setPlayingUI(false);
    progressFill.style.width = "0%";
    timeLabel.textContent = "00:00 / 00:00";
  }

  function loadPageAudio(autoPlay = false) {
    stopCurrentAudio();
    audioEl.src = PAGES[currentPage].audio;
    audioEl.playbackRate = parseFloat(document.getElementById("speedSelect").value || "1");
    if (autoPlay) {
      audioEl.play().then(() => setPlayingUI(true)).catch(() => {});
    }
  }

  function toggleNarration() {
    if (!audioEl.paused) {
      audioEl.pause();
      setPlayingUI(false);
    } else {
      if (!audioEl.src) audioEl.src = PAGES[currentPage].audio;
      audioEl.playbackRate = parseFloat(document.getElementById("speedSelect").value || "1");
      audioEl.play().then(() => setPlayingUI(true)).catch(() => {});
    }
  }

  audioEl.addEventListener("timeupdate", () => {
    if (audioEl.duration) {
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = pct + "%";
      timeLabel.textContent = formatSec(audioEl.currentTime) + " / " + formatSec(audioEl.duration);
    }
  });

  audioEl.addEventListener("loadedmetadata", () => {
    timeLabel.textContent = "00:00 / " + formatSec(audioEl.duration);
  });

  audioEl.addEventListener("ended", () => {
    setPlayingUI(false);
    progressFill.style.width = "100%";
    if (autoNext && currentPage < PAGES.length - 1) {
      setTimeout(() => goToPage(currentPage + 1, true), 550);
    }
  });

  function seekAudio(e) {
    if (!audioEl.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    audioEl.currentTime = ratio * audioEl.duration;
  }

  function toggleAutoNext() {
    autoNext = !autoNext;
    const btn = document.getElementById("autoNextBtn");
    btn.classList.toggle("on", autoNext);
    btn.textContent = autoNext ? "🔁 自动翻页" : "⏹ 单页播放";
  }

  function changeSpeed() {
    audioEl.playbackRate = parseFloat(document.getElementById("speedSelect").value || "1");
  }

  function goToPage(idx, autoPlayAfterFlip = false) {
    if (idx < 0 || idx >= PAGES.length || idx === currentPage) return;
    currentPage = idx;
    playPageFlipSound();
    renderPageUI();
    loadPageAudio(autoPlayAfterFlip);
  }

  function nextPage() {
    if (currentPage < PAGES.length - 1) goToPage(currentPage + 1, false);
  }

  function prevPage() {
    if (currentPage > 0) goToPage(currentPage - 1, false);
  }

  function toggleArtOnly() {
    const stage = document.getElementById("bookStage");
    const isArt = stage.classList.toggle("art-only");
    document.getElementById("artToggleBtn").textContent = isArt ? "📖 显示字幕条" : "🖼 纯享全图";
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  // Mobile Touch Swipe Left/Right to Turn Pages
  let touchStartX = 0;
  let touchStartY = 0;
  const spreadsContainer = document.getElementById("spreadsContainer");

  spreadsContainer.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  }, { passive: true });

  spreadsContainer.addEventListener("touchend", (e) => {
    if (e.changedTouches.length === 1) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.25) {
        if (dx < 0) nextPage();
        else prevPage();
      }
    }
  }, { passive: true });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") nextPage();
    else if (e.key === "ArrowLeft") prevPage();
    else if (e.key === " ") {
      e.preventDefault();
      toggleNarration();
    }
  });

  renderPageUI();
  loadPageAudio(false);
</script>
</body>
